; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Arduino Nano R4, uploaded over its native USB with DFU: PlatformIO opens the
; port at 1200 baud, which starts the bootloader. The platform's own GCC 7.2
; has no build for the Raspberry Pi (linux_aarch64): GCC 12.3 has one, and the
; same compiler builds the firmware on every computer. The firmware of the
; Arduino Nano 3 is at the tag nano3-2.0.0.
[env:nano_r4]
platform = renesas-ra
board = nano_r4
framework = arduino
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
